name: ROBA Vienna - CI/CD Pipeline & Auto Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHub arayüzünden manuel tetiklemeye izin ver

jobs:
  # =========================================================================
  # 1. AŞAMA: KOD VE SÖZDİZİMİ (SYNTAX) DOĞRULAMA (LINTING)
  # =========================================================================
  lint-and-validate:
    name: PHP Syntax & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP Files in Child Theme and MU-Plugins
        run: |
          echo "Checking PHP syntax for custom code..."
          find wp-content/themes/flatsome-child -type f -name "*.php" -exec php -l {} \;
          find wp-content/mu-plugins -type f -name "*.php" -exec php -l {} \;
          echo "All PHP syntax checks passed successfully!"

  # =========================================================================
  # 2. AŞAMA: CANLI ORTAMA OTOMATİK DAĞITIM (DEPLOYMENT)
  # =========================================================================
  deploy-to-production:
    name: Deploy to Live Server
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SFTP / FTPS ile Canlı Sunucuya Dağıtım
      - name: Sync Files to Live Server via SFTP/FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 21 }}
          protocol: ${{ secrets.DEPLOY_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.DEPLOY_REMOTE_PATH || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/docs/**
            **/sample-data/**
            **/README.md
            **/wp-config-production-sample.php
            **/.DS_Store
            **/Thumbs.db
